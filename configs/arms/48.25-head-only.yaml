# openspec 48.25 arm `4825-headonly-s0`: a read-out head trained from scratch on the published
# checkpoint's frozen trunk (peer read 2026-11-05, CardoAI's head on frozen Nori).
# NOT PRODUCTION. NOT RUN. Pre-registration: docs/results/drafts/48.25_2026-11.md.
#
# The published recipe (configs/published/v4-cellattn-labels.yaml: model, prior, optimiser,
# 6,000 steps x 8 tasks = 48,000 tasks, seed 0) with two train keys added, and nothing else
# changed: train_only 'head' freezes everything but `FinancialTFM.head`, reinit_trained re-draws
# that head at its default initialisation after the checkpoint loads. It is run with
# `--init-from <published checkpoint>` (a per-invocation key, so absent here). The Kaggle
# kernel (scripts/kaggle/ts_4825_headonly_s0/) passes the same values as CLI flags on the
# published recipe, as every make_train_score.py arm does; tests/test_4825_arm.py checks that
# the two build the same configs.

model:
  max_features: 136
  max_classes: 2
  d_cell: 48
  d_model: 128
  n_heads: 4
  n_col_layers: 2
  n_layers: 4
  d_ff: 512                     # 4 x d_model, as the CLI resolved it
  dropout: 0.0
  pooling: meanmax
  column_id_dim: 16             # §104: the curve peaks here
  n_horizons: null
  n_cell_blocks: 1
  cell_labels: true             # §91: jointly necessary with the cell-attention block
  mask_embedding: false
  head_type: binned
  n_quantiles: 99
  n_cell_heads: null
  n_summary_tokens: 1
  value_embedding: mlp
  value_basis_size: 16
  value_basis_learnable: false
  value_ecdf: false
  attn_length_scale: false
  attn_length_ref: 512
  attn_impl: masked
  hazard_period_context: false
  cell_row_attn: full
  cell_mixing: attention
  n_inducing: 64
  readout: pool
  n_readout: 4
  head_mlp: false

train:
  train_only: head           # 48.25: freeze all but the read-out head
  reinit_trained: true      # 48.25: the head is drawn afresh, not continued
  steps: 6000
  batch_size: 8
  lr: 3.0e-4                    # §127: the default wins at this recipe
  warmup_steps: 500
  log_every: 50
  eval_every: 500
  checkpoint_every: 1000        # §90's runs set it; saving changes no weight
  seed: 0
  feature_chunk: 8              # identity-preserving (§81); bounds memory on a T4
  optimizer: adamw
  task_dump: null
  task_dump_allow_code_mismatch: false
  decay_norm_bias: true
  masked_column_prob: 0.0
  amp: "none"
  muon_lr: null                 # Muon keys unused: the recipe is adamw
  muon_scale: rms_match
  loader: sync                  # DR5.2/DR5.4 keys: the recipe predates them
  loader_workers: 0
  loader_prefetch: 2
  ddp: false
  schedule: cosine
  decay_frac: 0.1               # unused under cosine
  lr_min: 0.0                   # unused under cosine
  eval_set_seed: null
  eval_batches: 5

prior:
  sharpness_min: 0.3
  sharpness_max: 12.0
  min_expected_positives: 2.0
  absolute_rate_floor: 0.001
  rate_ceiling: 0.30
  n_sectors: 12
  min_ctx_per_class: 0
  permute_classes: false
  feature_transforms: []
  max_query_rows: null
  pad_to_batch_width: false
  n_rows: 256                   # unused: n_rows_choices is set
  n_rows_choices: [256, 512, 1024]
  p_financial: 1.0
  p_tree: 0.0
  p_trivial: 0.0
  p_crossed: 0.0
  p_task_family: 0.0
  p_regression: 0.0
  p_learnability_filter: 0.0
  scm_legacy: false
  scm_reuse_graph: 1
  identity_shuffle: false
  discretize_frac: 0.0
  n_noise_features: 0
  n_correlated_block_features: 0
  label_noise_rate: 0.0
  p_real_edgar: 0.0
  real_edgar_panel_path: data/edgar/panel.parquet
  p_real_mortgage: 0.0
  real_mortgage_panel_path: data/mortgage/panel.parquet
  p_real_lendingclub: 0.0
  real_lendingclub_panel_path: data/lendingclub/panel.parquet
  real_panels: ""
  source_weights: null            # the sequential source draw; DR2.1's weighted draw came later
  financial_gate_prob: 0.0      # design review DR2.2; the published run had no gated labels
  financial_sign_flip_prob: 0.0 # DR2.2's ratio sign flip; the published run had none
  feature_ratio_bands: []       # DR2.3 knobs, all at their pre-knob behaviour
  p_binary: null
  imbalance_draws: false
  categorical_mode: ordered
  missing_mode: mcar
  tie_column_prob: 0.0
  irrelevant_frac_max: 0.0
  duplicate_frac_max: 0.0
  label_flip_max: 0.0
  heavy_tail_column_prob: 0.0   # AU5.11 knobs, all at their pre-knob behaviour (byte-identical
  tree_split_by: std            # prior output, tests/test_prior_diversity.py); the published
  missing_label: false          # run predates them
