# Design review DR3.3, arm "floor16": a uniform context whose positive count is fixed and
# never below 16.
#
# NOT PRODUCTION. MEASUREMENT OPEN. As configs/arms/dr33-exact.yaml, but the count is
# max(16, round(2000 x the fold's training positive rate)), so a fold whose rate would give
# fewer than 16 positives is lifted to 16; the D5 base-rate correction reads the context's
# actual rate and shifts the level back to the population's. Where the rounded count already
# reaches 16 this arm draws the same context as "exact" at the same seed.
#
#   uv run --frozen fintfm-v4protocol --model runs/v4-cellattn-labels.pt \
#     --config configs/arms/dr33-floor16.yaml --no-boosting --device cpu --out runs/dr33/floor16

inference:
  context_positive_floor: 16
