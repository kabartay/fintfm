# Audit AU5.8, arm "retrieval-pc16": LoCalPFN-style per-class retrieval, the 16 nearest
# positives plus the 1,984 nearest negatives of each query group (arXiv 2406.05207,
# reimplemented). NOT PRODUCTION. MEASUREMENT OPEN; NOT RUN (full-panel V4FinBench, deferred for
# memory; docs/results/drafts/inference_tasks_2026-11.md).
#
# Why 16: §194's single-neighbourhood retrieval filled each 2,000-row context with 45-222
# positives (9.74% pooled, 27 times the pool's 0.3546%), the same 540 defaults over and over, and
# AP fell to 0.0126. A fixed 16 (0.8%) caps the positive share near DR3.3's floor16 and tests
# whether the collapse is the class share or the neighbourhood itself. Every other key inherits
# the packaged default.
#
#   uv run --frozen fintfm-v4protocol --model runs/v4-cellattn-labels.pt \
#     --config configs/arms/au58-retrieval-pc16.yaml --no-boosting --device cpu \
#     --out runs/au58/retrieval-pc16

inference:
  context_strategy: retrieval
  retrieval_per_class: 16
