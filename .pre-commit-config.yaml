# Runs the cheap checks before a commit is made, not after it is pushed.
#
# Why: `ruff` errors reached `main` twice on 2026-09-24 — once on the v0.4.0 release commit,
# which shipped with CI red, and once in the commit that fixed it. Both times `uv run pytest`
# was green locally and `ruff` was simply not run, because CLAUDE.md's release checklist is a
# thing a human has to remember. This makes forgetting impossible rather than discouraged.
#
#     uv run pre-commit install     # once, per clone
#
# The expensive checks (pytest, the licence and link checkers, the openspec validator) stay in
# CI. A hook that takes a minute gets bypassed with --no-verify, which is worse than not
# having one.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        # Format-checking only: this repository is not ruff-formatted end to end, and
        # reformatting it in a hook would bury real changes under whitespace diffs.
        stages: [manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # Checkpoints are gitignored, but a `git add -f` would slip one in. Weights are the
        # private asset and must not enter git (CLAUDE.md).
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: detect-private-key
