[project]
name = "fintfm"
version = "0.1.0"
description = "A tabular foundation model for financial risk — pretrained on synthetic company financials, so it predicts credit default with no training on your data"
readme = "README.md"
authors = [
    { name = "Mukharbek Organokov", email = "mukharbek.organokov@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.18.1",
    "torch>=2.4",
]

[project.optional-dependencies]
bench = ["lightgbm>=4.0"]
# V4FinBench data lives on Kaggle and needs an account. Data is CC BY 4.0; the
# kagglehub client is Apache-2.0. See docs/FINDINGS.md §8.
kaggle = [
    "kaggle>=1.6",
    "kagglehub>=0.3",
    "pyarrow>=17",
]

[project.scripts]
fintfm-train = "fintfm.modeling.train:main"
fintfm-bench = "fintfm.evaluation.bench:main"
fintfm-ablate = "fintfm.experiments.prior_ablation:main"
fintfm-termstruct = "fintfm.experiments.term_structure:main"
fintfm-fetch = "fintfm.evaluation.fetch:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
