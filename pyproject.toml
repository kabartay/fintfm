[project]
name = "fintfm"
version = "0.7.1"
description = "A tabular foundation model for financial risk, pretrained on synthetic company financials, so it predicts credit default with no training on your data by default; dataset-specific fine-tuning is opt-in (finetune_steps)"
readme = "README.md"
authors = [
    { name = "Mukharbek Organokov", email = "mukharbek.organokov@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
# 3.12, not 3.13. The bound was 3.13 only because that was the local interpreter, and nothing
# in the codebase uses 3.13 syntax or stdlib. It cost a GPU probe: the standard CUDA PyTorch
# images ship Python 3.12.3, so `pip install fintfm` failed with "requires a different
# Python". A library aimed at banks should not demand an interpreter released last year.
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "pyyaml>=6.0",
    "scipy>=1.18.1",
    "torch>=2.4",
]

[project.optional-dependencies]
bench = [
    "catboost>=1.2",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    # V4FinBench ships as parquet, so *reading* it is a benchmarking dependency even though
    # *fetching* it is a `kaggle` one. Declared in both: pyarrow lived only in `kaggle` and
    # a bare `uv sync --extra bench` therefore broke the loader that every out-of-time
    # finding depends on, while CI stayed green because CI has no data and skips the test.
    "pyarrow>=26.0.0",
]
# Hugging Face Jobs, for GPU pretraining runs. huggingface_hub is Apache-2.0.
# See docs/infra/HF_JOBS.md; secrets go through `--secrets`, never `-e`.
hf = [
    # not `[cli]` -- that extra was removed by hub 1.30 and resolves to a warning plus no CLI.
    # The `hf` command ships in the base package.
    "huggingface_hub>=2.2.0",
]

# The TabArena overlap report (design review DR4.1, `fintfm.evaluation.overlap --report
# --fetch`): openml-python (BSD-3-Clause) fetches TabArena-v0.1's datasets into its own cache,
# huggingface_hub (Apache-2.0) fetches BeyondArena's parquet files, and pyarrow reads both.
# Evaluation hashing only; nothing fetched here trains anything. Each read dependency is
# declared here as well as in its usual extra, for the reason the `bench` comment gives.
overlap = [
    "openml>=0.15",
    "huggingface_hub>=2.2.0",
    "pyarrow>=26.0.0",
]

# FinTFM-R (task A2/A3): the real EDGAR panel `scripts/edgar/build_panel.py` writes and
# `prior/real_edgar.py` reads is parquet. Declared in its own extra rather than assumed from
# `bench`/`kaggle` already having it -- CLAUDE.md's own lesson is that a dependency declared
# in only one extra breaks the moment a different sync is used, and `--p-real-edgar` is reached
# from `fintfm-train`, not from the benchmark harness that happens to need parquet too.
real = [
    "pyarrow>=26.0.0",
    # scripts/edgar/build_panel.py's own direct dependency (SEC's two public endpoints),
    # declared here rather than relied on transitively from another extra -- the exact trap
    # this file's pyarrow comment already documents once.
    "requests>=2.31",
]

# V4FinBench data lives on Kaggle and needs an account. Data is CC BY 4.0; the
# kagglehub client is Apache-2.0. See docs/results/FINDINGS.md §8.
kaggle = [
    "kaggle>=1.6",
    "kagglehub>=0.3",
    "pyarrow>=26.0.0",
]

# Schedule-free optimisation (task 48.9, Defazio et al., NeurIPS 2024), behind --optimizer
# schedulefree. Apache-2.0. Not a core dependency since the cosine-schedule AdamW default
# needs none of it.
schedulefree = [
    "schedulefree>=1.4",
]

[project.urls]
Homepage = "https://github.com/kabartay/fintfm"
Repository = "https://github.com/kabartay/fintfm"
Changelog = "https://github.com/kabartay/fintfm/blob/main/docs/CHANGELOG.md"
Checkpoint = "https://huggingface.co/kabartay/fintfm-binary"
"Measurement log" = "https://github.com/kabartay/fintfm/blob/main/docs/results/FINDINGS.md"

[project.scripts]
fintfm-train = "fintfm.modeling.train:main"
fintfm-bench = "fintfm.evaluation.bench:main"
fintfm-ablate = "fintfm.experiments.prior_ablation:main"
fintfm-termstruct = "fintfm.experiments.term_structure:main"
fintfm-v4oot = "fintfm.experiments.v4_out_of_time:main"
fintfm-ctxsweep = "fintfm.experiments.context_sweep:main"
fintfm-retrgroup = "fintfm.experiments.retrieval_grouping:main"
fintfm-v4protocol = "fintfm.experiments.v4_protocol:main"
fintfm-capability = "fintfm.experiments.capability:main"
fintfm-priorscore = "fintfm.experiments.prior_score:main"
fintfm-fetch = "fintfm.evaluation.fetch:main"

[dependency-groups]
# `pre-commit` is here rather than installed ad hoc: `uv pip install` puts a tool in one
# venv and not in the lockfile, so the next `uv sync` removes it and a fresh clone never has
# it. That is how the `hf` CLI disappeared mid-session on 2026-09-24.
dev = ["pytest>=8", "ruff>=0.17.1", "pre-commit>=4.7.0"]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
