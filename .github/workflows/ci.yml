name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # `requires-python` says >=3.12, so 3.12 must actually be exercised. It was >=3.13 for
      # no reason beyond the local interpreter, and that cost a GPU probe: the standard CUDA
      # PyTorch images ship 3.12.3, so installing the wheel failed outright. A floor nobody
      # tests is a guess (docs/infra/HF_JOBS.md).
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # The `bench` extra carries LightGBM, CatBoost and XGBoost. They are the baselines
      # that actually compete, and they were silently absent from every comparison until
      # docs/results/FINDINGS.md #25 - so CI installs them rather than letting them skip quietly.
      # Linux uses libgomp and does not hit the macOS OpenMP conflict (docs/infra/COMPUTE.md).
      - name: Sync dependencies
        run: uv sync --extra bench

      - name: Lint
        run: uv run ruff check src/ tests/ scripts/ openspec/tools/

      # Enforces this repository's own conventions: every spec requirement names what
      # enforces it, every proposal carries its required sections, every open task states a
      # verification, and every finding declares whether its numbers are MEASURED,
      # SMOKE-TEST, SIMULATED or ESTIMATED. It found ten violations the first time it ran.
      - name: Validate openspec and findings provenance
        run: uv run python openspec/tools/validate.py

      # Tests that need a licensed dataset skip rather than fail; a clean checkout has no
      # data/ directory. Verified locally: 72 passed, 2 skipped on a fresh clone.
      - name: Tests
        run: uv run pytest -q

      # A hand-written list of dependency licences in README.md is a claim about the past.
      # This is the project's most-repeated rule (`CLAUDE.md`) and it was enforced only by
      # memory; a rule enforced by memory fails silently the first time someone is busy.
      # Code licences of Python distributions only -- it cannot see a *weights* licence,
      # which is the one that actually bites.
      - name: Dependency licences are permissive
        run: uv run python scripts/check_licences.py

      # Grouping docs/ into subfolders rewrote 234 references across 135 files. Two links
      # were already broken beforehand and nobody had noticed, because a broken link costs
      # nothing until someone follows it -- by which time the document has been wrong for
      # weeks.
      - name: Documentation links resolve
        run: uv run python scripts/check_doc_links.py

      # Zenodo accepts a malformed deposit at the webhook (HTTP 202), discards it during
      # asynchronous processing, and then shows it as "received" -- which looks exactly like
      # success. v0.5.2 was lost that way over a capitalised licence id. Check it here, where
      # failing is visible, rather than by noticing weeks later that no DOI exists.
      - name: Zenodo deposit metadata is valid
        run: uv run python scripts/check_zenodo_metadata.py

      # **Non-blocking, deliberately.** `py.typed` is shipped and every signature is annotated,
      # but `ty` found 41 diagnostics on 2026-09-25, nearly all in this repository's own code —
      # so the hints are present and not yet sound. Gating on it today would fail every push,
      # and a gate that always fails is one people learn to bypass.
      # It runs so the count is visible and can be driven down; make it blocking when it hits
      # zero, not before.
      #
      # `continue-on-error` keeps the run green but still posts a red annotation, which reads
      # as "2 errors" on a passing build and has been mistaken for a real failure more than
      # once. Surface the count as a notice and exit 0, so the number stays visible without
      # claiming the build broke.
      - name: Type check (informational)
        continue-on-error: true
        run: |
          uv run --with ty ty check src/ 2>&1 | tee "$RUNNER_TEMP/ty.log"
          found=$(grep -oE 'Found [0-9]+ diagnostics?' "$RUNNER_TEMP/ty.log" | tail -1)
          echo "::notice title=Type check (not gated)::${found:-no diagnostics reported}"

      - name: Build wheel and sdist
        run: uv build

      - name: Check the licence ships in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(whl).namelist()
          assert any("LICENSE" in n for n in names), "Apache-2.0 licence missing from wheel"
          assert any(n.endswith("py.typed") for n in names), "py.typed marker missing"
          # the packaged default config must ship: load_config() reads it at runtime, so a
          # wheel without it fails on import of any experiment rather than at build time
          assert any(
              n.endswith("fintfm/configs/default.yaml") for n in names
          ), "packaged default config missing from wheel"
          print(f"{whl}: licence, typing marker and packaged config present")
          PY

      # Presence in the archive is not the same as usable once installed: the config is read
      # at runtime by path, so install the wheel into a clean environment and load it there.
      - name: Load the packaged config from an installed wheel
        run: |
          whl=$(ls dist/*.whl | tail -1)
          uv venv /tmp/instchk
          VIRTUAL_ENV=/tmp/instchk uv pip install --python /tmp/instchk/bin/python "$whl"
          /tmp/instchk/bin/python -c "
          from fintfm.config import load_config
          cfg = load_config()
          assert cfg.v4finbench.test_from > cfg.v4finbench.train_until
          assert cfg.context_sweep.strategies
          print('packaged config loads from an installed wheel:', cfg.provenance())
          "
