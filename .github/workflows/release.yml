# Fires on a version tag. Builds the distributions, re-runs the checks that matter for a
# *shipped* artifact rather than a working tree, and attaches them to the GitHub release.
#
# Why this exists: v0.4.0 was tagged by hand at a commit whose lint check was red, and its
# notes claimed this repository had no CI. Both were caught afterwards, and re-tagging was
# only possible because the repository was private at the time. It is public now, so a bad
# release is superseded rather than replaced — which makes a gate before publication worth
# more than a check after it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to attach artifacts to the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra bench --extra hf

      # The same gates CI runs. A tag can point at any commit, including one that never
      # passed on main, so this re-runs them rather than trusting that it did.
      - name: Lint
        run: uv run ruff check src/ tests/ scripts/ openspec/tools/

      - name: Validate openspec and findings provenance
        run: uv run python openspec/tools/validate.py

      - name: Dependency licences are permissive
        run: uv run python scripts/check_licences.py

      - name: Documentation links resolve
        run: uv run python scripts/check_doc_links.py

      - name: Tests
        run: uv run pytest -q

      - name: Build wheel and sdist
        run: uv build

      # The tag and the packaged version must agree. They can drift when a release is cut
      # without bumping pyproject.toml, and the wheel is what a user installs — so the tag
      # would be describing something the artifact does not claim to be.
      # Four places state the version and all four must agree: the tag, the wheel built from
      # pyproject.toml, CITATION.cff, and .zenodo.json. They drift when a release is cut
      # without bumping one of them, and the failure is silent — the wheel is what a user
      # installs, CITATION.cff is what ends up in someone else's reference list, and
      # .zenodo.json is the metadata the minted DOI carries permanently.
      - name: Tag, wheel, CITATION.cff and .zenodo.json state the same version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import glob, json, os, re, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          whl = os.path.basename(sorted(glob.glob("dist/*.whl"))[-1])
          built = re.match(r"fintfm-([^-]+)-", whl).group(1)
          cff = open("CITATION.cff").read()
          cited = re.search(r"^version:\s*(\S+)", cff, re.M).group(1).strip('"')
          deposited = json.load(open(".zenodo.json"))["version"]
          problems = []
          if tag != built:
              problems.append(f"tag v{tag} != wheel {built} (bump pyproject.toml)")
          if tag != cited:
              problems.append(f"tag v{tag} != CITATION.cff {cited} (bump CITATION.cff)")
          if tag != deposited:
              problems.append(f"tag v{tag} != .zenodo.json {deposited} (bump .zenodo.json)")
          if problems:
              sys.exit("version mismatch:\n  " + "\n  ".join(problems))
          print(f"tag, wheel, CITATION.cff and .zenodo.json all say {tag}")
          PY

      # The version agreeing is not the same as the deposit being publishable. This is the
      # last point at which a bad .zenodo.json can still be fixed cheaply: after the release
      # is published, correcting it costs another tag.
      - name: Zenodo deposit metadata is valid
        run: uv run python scripts/check_zenodo_metadata.py

      # Presence in the archive is not usability once installed: the packaged config is read
      # at runtime by path, so install into a clean environment and load it there.
      - name: The installed wheel can load its packaged config
        run: |
          whl=$(ls dist/*.whl | tail -1)
          uv venv /tmp/relcheck
          VIRTUAL_ENV=/tmp/relcheck uv pip install --python /tmp/relcheck/bin/python "$whl"
          /tmp/relcheck/bin/python -c "
          from fintfm.config import load_config
          cfg = load_config()
          assert cfg.v4finbench.test_from > cfg.v4finbench.train_until
          print('packaged config loads from an installed wheel:', cfg.provenance())
          "

      - name: Attach distributions to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # Handed to the publish job rather than rebuilt there, so the artifact that reaches PyPI
      # is byte-for-byte the one every check above ran against.
      - name: Hand the distributions to the publish job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Publishes to PyPI through Trusted Publishing: PyPI verifies a short-lived OIDC token issued
  # to this workflow, so there is no API token to store, leak or rotate. It requires a publisher
  # registered on PyPI for this repository and the `pypi` environment named below.
  #
  # A separate job because it must not start until every gate in `build` has passed. An upload to
  # PyPI cannot be undone: a version number is spent permanently, and yanking hides a release
  # without freeing its number.
  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fintfm
    permissions:
      id-token: write  # mints the OIDC token Trusted Publishing exchanges; nothing else needs it
    steps:
      - name: Collect the distributions built above
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
