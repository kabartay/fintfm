# fintfm default configuration.
#
# This file is the single declared place for the numbers that experiments and command-line
# entry points use. Override it with `--config path/to/file.yaml` on any experiment CLI, or
# by setting FINTFM_CONFIG; an override is deep-merged over these values, so a file need only
# carry what it changes. Individual CLI flags override both.
#
# WHAT DELIBERATELY DOES NOT LIVE HERE
# ------------------------------------
# Not every literal in the codebase is configuration, and treating them all as such makes a
# system less robust rather than more. These stay in code on purpose:
#
#   * hazard.CENSORED (-1) and the observation-mask semantics -- part of the data contract.
#     A configurable sentinel is a way to silently reinterpret every stored period label.
#   * retrieval._SCALE_FLOOR, HazardHead.max_hazard, the log1p/clamp epsilons -- numerical
#     guards whose values are tied to float32 behaviour, not to a modelling choice.
#   * the accounting identities in prior/financial.py -- these are arithmetic, not settings.
#   * dataset URLs and licence attributions -- provenance, and changing one silently would
#     break the licence record in README.md.
#
# The rule: a value belongs here if a reasonable experiment would want it different. A value
# whose change would make results incomparable or the code incorrect stays in code.

# Library defaults for FinancialTFMClassifier. These MIRROR the literal defaults in
# inference/classifier.py rather than replacing them: a library should behave identically
# without reading a file from disk, so the code keeps its own defaults and
# tests/test_config.py asserts the two agree. That test is the drift guard -- if you change
# one, it fails until you change the other.
inference:
  max_context: 2000
  context_strategy: uniform      # docs/design/DECISIONS.md D10; was "balanced" before 2026-09-09
  feature_transform: rank        # docs/results/FINDINGS.md §35
  n_ensemble: 1                  # D12's stated mitigation for the column-order invariance
  correct_prior: true
  query_chunk: 2048
  feature_chunk: 16              # identity-preserving memory knob; docs/results/FINDINGS.md §81
  retrieval_groups: 64
  retrieval_min_positive: 8
  prototype_minority_ratio: 0.3   # Kostrzewa et al.'s value; docs/results/FINDINGS.md §38
  winsor_quantile: 0.01
  transform_subsample: 20000
  # §163: dataset-specific fine-tuning in fit(); 0 steps = the zero-shot model, unchanged
  finetune_steps: 0
  finetune_lr: 1.0e-5
  finetune_batch: 2
  finetune_query: 512
  finetune_context: null
  finetune_query_group_frac: 0.3
  finetune_query_pos_frac: null   # §164: e.g. 0.1, importance-weighted
  finetune_seed: 0
  # Audit AU5.12/AU5.7 experiment levers; these defaults reproduce the classifier as it was
  ensemble_transforms: null        # e.g. [rank, power, squash], cycled over members
  ensemble_svd_components: 0       # SVD projections appended in odd-indexed members
  ensemble_class_shift: false      # cyclic class relabelling per member, mapped back
  max_features_strategy: raise     # or "subsample": round-robin column subsets per member

# Thresholds used when scoring. Changing these changes what counts as a result, so they are
# recorded in every run's output alongside the numbers they produced.
evaluation:
  bootstrap_resamples: 2000
  alpha: 0.05
  ece_bins: 10
  # a horizon with fewer observed rows than this, or only one class, is reported as NaN
  # rather than scored -- see docs/results/FINDINGS.md on degenerate splits poisoning aggregates
  min_rows_per_horizon: 100

# The V4FinBench out-of-time protocol. The split years are the load-bearing numbers here:
# train and test must not overlap, and time_split() refuses if they do.
v4finbench:
  max_rows: 120000
  train_until: 2016
  test_from: 2017
  max_context: 2000
  # scored side by side; the uncorrected arm is permanent by decision D8, so that the
  # base-rate distortion of docs/results/FINDINGS.md §28 is measured rather than assumed absent
  hazard_arms:
    - {name: fintfm_hazard, strategy: prototype, correct_prior: true}   # best, §38
    - {name: fintfm_hazard_uncorrected, strategy: balanced, correct_prior: false}
    - {name: fintfm_hazard_uniform, strategy: uniform, correct_prior: true}

# The context-strategy sweep behind docs/results/FINDINGS.md §29, §32 and §33.
context_sweep:
  strategies: [balanced, hybrid, uniform, retrieval]
  # 2000 is the operating point: on three seeds 4000 ties with it for 1.7x the time (§33)
  context_sizes: [1000, 2000, 4000]
  retrieval_groups: 64
  seeds: [0]

# The financial prior's default-rate envelope. The floor is what lets the prior reach the
# low-default regime the strategy targets: at two expected defaults a 1,024-row task reaches
# 0.195%, which covers V4FinBench's 0.19% (docs/infra/COMPUTE.md).
prior:
  # The financial prior's signal-to-noise range, drawn log-uniformly per task. Spans
  # near-pure-noise to near-deterministic (docs/results/FINDINGS.md §42), and §64 measured this as
  # the variable that predicts what a prior teaches.
  sharpness_min: 0.3
  sharpness_max: 12.0
  min_expected_positives: 2.0
  absolute_rate_floor: 0.001
  rate_ceiling: 0.30
  n_sectors: 12
  # Context rows guaranteed to every class once the batch's split is drawn (audit AU1.16).
  # 0 moves nothing and reproduces every existing checkpoint; any other value changes the
  # pretraining distribution. Mirrors PriorConfig.min_ctx_per_class (tests/test_config.py).
  min_ctx_per_class: 0

# Pretraining knobs read by fintfm-train (audit AU5.2, AU5.10, AU5.17). These MIRROR the literal
# defaults of TrainConfig in modeling/train.py, as the inference section mirrors the classifier,
# so train() behaves the same without reading a file; tests/test_config.py is the drift guard.
# Every value here reproduces pretraining as it ran before the knob existed.
train:
  warmup_steps: 500        # linear warmup before the cosine decay
  decay_norm_bias: true    # true = AdamW decays every parameter; false exempts norms/biases/embeddings
  amp: "none"              # "none" (float32), "bf16" or "fp16" autocast; quoted, YAML reads off as false
  muon_lr: 0.02            # Muon's matrix-group rate; read only under --optimizer muon

# Architecture knobs read by fintfm-train (audit AU5.3, AU5.9, AU5.16, AU5.17). These MIRROR
# ModelConfig's literal defaults in modeling/model.py, which stay authoritative because a
# checkpoint rebuilds its model without reading a file; tests/test_config.py is the drift guard.
# Every value here builds the architecture as it was before the knob existed.
model:
  n_heads: 4                    # attention heads; must divide d_cell and d_model
  n_cell_heads: null            # heads in the cell-width stages; null shares n_heads (AU5.3)
  n_summary_tokens: 1           # >1: K learned summary tokens per row replace mean+max (AU5.3)
  value_embedding: mlp          # mlp, rbf or fourier basis on the cell value (AU5.16)
  value_basis_size: 16          # RBF centres or Fourier frequencies; unused for mlp
  value_basis_learnable: false  # train the basis centres/widths or frequencies
  value_ecdf: false             # context-only ECDF-rank channel per cell (AU5.16)
  attn_length_scale: false      # row-attention logits times log(n_ctx)/log(attn_length_ref) (AU5.17)
  attn_length_ref: 512          # context length at which the length scale is 1
  hazard_period_context: false  # hazard context rows embed their default period (AU5.9)
