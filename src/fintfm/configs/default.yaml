# fintfm default configuration.
#
# This file is the single declared place for the numbers that experiments and command-line
# entry points use. Override it with `--config path/to/file.yaml` on any experiment CLI, or
# by setting FINTFM_CONFIG; an override is deep-merged over these values, so a file need only
# carry what it changes. Individual CLI flags override both.
#
# WHAT DELIBERATELY DOES NOT LIVE HERE
# ------------------------------------
# Not every literal in the codebase is configuration, and treating them all as such makes a
# system less robust rather than more. These stay in code on purpose:
#
#   * hazard.CENSORED (-1) and the observation-mask semantics -- part of the data contract.
#     A configurable sentinel is a way to silently reinterpret every stored period label.
#   * retrieval._SCALE_FLOOR, HazardHead.max_hazard, the log1p/clamp epsilons -- numerical
#     guards whose values are tied to float32 behaviour, not to a modelling choice.
#   * the accounting identities in prior/financial.py -- these are arithmetic, not settings.
#   * dataset URLs and licence attributions -- provenance, and changing one silently would
#     break the licence record in README.md.
#
# The rule: a value belongs here if a reasonable experiment would want it different. A value
# whose change would make results incomparable or the code incorrect stays in code.

# Library defaults for FinancialTFMClassifier. These MIRROR the literal defaults in
# inference/classifier.py rather than replacing them: a library should behave identically
# without reading a file from disk, so the code keeps its own defaults and
# tests/test_config.py asserts the two agree. That test is the drift guard -- if you change
# one, it fails until you change the other. Every constructor argument but model, device and
# random_state has a key, and FinancialTFMClassifier.from_config passes every key (DR1.3).
inference:
  max_context: 2000
  context_strategy: uniform      # docs/design/DECISIONS.md D10; was "balanced" before 2026-09-09
  feature_transform: rank        # docs/results/FINDINGS.md §35
  n_ensemble: 1                  # D12's stated mitigation for the column-order invariance
  ensemble_label_swap: false     # average each member with its label-swapped twin (§45)
  ensemble_feature_frac: 1.0     # features each member sees; below 1.0 a diversity axis (§45)
  correct_prior: true
  query_chunk: 2048
  feature_chunk: 16              # identity-preserving memory knob; docs/results/FINDINGS.md §81
  retrieval_groups: 64
  retrieval_min_positive: 8
  prototype_minority_ratio: 0.3   # Kostrzewa et al.'s value; docs/results/FINDINGS.md §38
  winsor_quantile: 0.01          # tail clipped at each end by feature_transform "winsor"
  transform_subsample: 20000     # rows sampled to fit the conditioning's quantiles
  # §163: dataset-specific fine-tuning in fit(); 0 steps = the zero-shot model, unchanged
  finetune_steps: 0
  finetune_lr: 1.0e-5
  finetune_batch: 2
  finetune_query: 512
  finetune_context: null
  finetune_query_group_frac: 0.3
  finetune_query_pos_frac: null   # §164: e.g. 0.1, importance-weighted
  finetune_seed: 0
  finetune_clip: null             # gradient-norm clip per step; null = none, as §163/§164 ran
  # Audit AU5.12/AU5.7 experiment levers; these defaults reproduce the classifier as it was
  ensemble_transforms: null        # e.g. [rank, power, squash], cycled over members
  ensemble_svd_components: 0       # SVD projections appended in odd-indexed members
  ensemble_class_shift: false      # cyclic class relabelling per member, mapped back
  max_features_strategy: raise     # or "subsample": round-robin column subsets per member;
                                   # or "select" (DR8.3): keep the top max_features columns
  select_method: extra_trees       # "select"'s ranking; or mutual_info (univariate)
  select_subsample: 20000          # training rows the "select" ranking is computed on
  retrieval_per_class: null        # AU5.8: k_pos nearest positives + rest nearest negatives
  # DR3.3: uniform context with exactly max(floor, round(max_context x pool rate)) positives,
  # the rest uniform from the negatives; null = today's uniform draw (count left to chance)
  context_positive_floor: null

# Thresholds used when scoring. Changing these changes what counts as a result, so they are
# recorded in every run's output alongside the numbers they produced.
evaluation:
  bootstrap_resamples: 2000
  alpha: 0.05
  ece_bins: 10
  # a horizon with fewer observed rows than this, or only one class, is reported as NaN
  # rather than scored -- see docs/results/FINDINGS.md on degenerate splits poisoning aggregates
  min_rows_per_horizon: 100

# The V4FinBench out-of-time protocol. The split years are the load-bearing numbers here:
# train and test must not overlap, and time_split() refuses if they do.
v4finbench:
  max_rows: 120000
  train_until: 2016
  test_from: 2017
  max_context: 2000
  # scored side by side; the uncorrected arm is permanent by decision D8, so that the
  # base-rate distortion of docs/results/FINDINGS.md §28 is measured rather than assumed absent
  hazard_arms:
    - {name: fintfm_hazard, strategy: prototype, correct_prior: true}   # best, §38
    - {name: fintfm_hazard_uncorrected, strategy: balanced, correct_prior: false}
    - {name: fintfm_hazard_uniform, strategy: uniform, correct_prior: true}

# The context-strategy sweep behind docs/results/FINDINGS.md §29, §32 and §33.
context_sweep:
  strategies: [balanced, hybrid, uniform, retrieval]
  # 2000 is the operating point: on three seeds 4000 ties with it for 1.7x the time (§33)
  context_sizes: [1000, 2000, 4000]
  retrieval_groups: 64
  seeds: [0]

# The financial prior's default-rate envelope. The floor is what lets the prior reach the
# low-default regime the strategy targets: at two expected defaults a 1,024-row task reaches
# 0.195%, which covers V4FinBench's 0.19% (docs/infra/COMPUTE.md).
prior:
  # The financial prior's signal-to-noise range, drawn log-uniformly per task. Spans
  # near-pure-noise to near-deterministic (docs/results/FINDINGS.md §42), and §64 measured this as
  # the variable that predicts what a prior teaches.
  sharpness_min: 0.3
  sharpness_max: 12.0
  min_expected_positives: 2.0
  absolute_rate_floor: 0.001
  rate_ceiling: 0.30
  n_sectors: 12
  # Context rows guaranteed to every class once the batch's split is drawn (audit AU1.16).
  # 0 moves nothing and reproduces every existing checkpoint; any other value changes the
  # pretraining distribution. Mirrors PriorConfig.min_ctx_per_class (tests/test_config.py).
  min_ctx_per_class: 0
  # Audit Phase 5 pretraining levers, all off by default so every existing checkpoint's
  # batches are reproduced byte for byte. Each mirrors the PriorConfig field of the same name
  # (tests/test_config.py) and is overridden by the matching fintfm-train flag.
  # AU5.5: relabel each classification task's classes by a random permutation.
  permute_classes: false
  # AU5.6: per-task draw from these inference transforms (none, rank, power, winsor), fitted
  # on context rows only. [] applies none, as today.
  feature_transforms: []
  # AU5.4: cap query rows per task so a long context does not bring a long query with it.
  # null keeps every row.
  max_query_rows: null
  # DR6.1: pad each batch's features to its widest task, not to model.max_features. The
  # padding is masked, so outputs match full padding; false pads to max_features, as today.
  pad_to_batch_width: false
  # The task mixture and its size, one key per fintfm-train prior flag (DR1.3), so a recipe
  # is a file rather than a command line. Each mirrors the PriorConfig field of the same name
  # (tests/test_config.py); an explicit flag still wins. The prior takes max_features,
  # max_classes, n_horizons and head_type from the model section.
  n_rows: 256                     # rows per task when n_rows_choices is null
  n_rows_choices: null            # e.g. [256, 512, 1024], drawn per batch (§26)
  p_financial: 0.7                # forced to 1.0 when model.n_horizons is set (§14)
  p_tree: 0.0                     # tree-structured tasks (§111)
  p_trivial: 0.0                  # deliberately trivial control tasks (§53)
  p_crossed: 0.0                  # SCM features under the financial label (§66)
  p_task_family: 0.0              # task 40.2-40.6's families (§137-§141)
  p_regression: 0.0               # SCM latent kept continuous and binned
  p_learnability_filter: 0.0      # ExtraTrees accept/resample judge (§125, §129)
  scm_legacy: false               # the pre-48.17/48.19 SCM prior
  scm_reuse_graph: 1              # tasks drawn per SCM graph (task 48.12)
  identity_shuffle: false         # per-account column permutation (§67-§71)
  discretize_frac: 0.0            # task 48.6's realism augmentations, all off
  n_noise_features: 0
  n_correlated_block_features: 0
  label_noise_rate: 0.0
  # FinTFM-R's real sources (D17); 0.0 never opens a panel file
  p_real_edgar: 0.0
  real_edgar_panel_path: data/edgar/panel.parquet
  p_real_mortgage: 0.0
  real_mortgage_panel_path: data/mortgage/panel.parquet
  p_real_lendingclub: 0.0
  real_lendingclub_panel_path: data/lendingclub/panel.parquet
  real_panels: ""                 # further sources as "path=prob,path=prob"
  # DR2.1: one categorical source draw over these weights, normalised, in place of the
  # sequential chain above, whose p_* are conditional shares (FINDINGS §166). A mapping such
  # as {tree: 0.25, financial: 0.35, scm: 0.4}; a real panel is "real_panel:<path>". While set,
  # the p_* keys and real_panels must stay at their defaults. null keeps the sequential draw
  # and every existing checkpoint's batches byte for byte.
  source_weights: null
  # DR2.2: probability a financial task's label is gated (negative equity, negative working
  # capital, coverage < 1 or a random ratio threshold), ranked by the driver score inside the
  # gate with a small leakage outside. The generic gated prior is the source "gated", reached
  # through source_weights only. 0.0 keeps every financial label as today.
  financial_gate_prob: 0.0
  # DR2.2: probability each exposed ratio column of a financial task is negated, per task and
  # per column, so no ratio points the same way across tasks (FINDINGS §47). The label, gate
  # and NaN pattern are the unflipped task's. 0.0 consumes no draw and keeps every batch.
  financial_sign_flip_prob: 0.0
  # DR2.3: knob distributions for the general priors (prior/knobs.py), each off by default so
  # every existing checkpoint's batches are reproduced byte for byte. Each mirrors the
  # PriorConfig field of the same name (tests/test_config.py).
  feature_ratio_bands: []          # [[weight, lo, hi], ...] features per row; [] keeps U[2, max]
  p_binary: null                   # P(binary) for SCM/tree; null keeps U[2, max_classes]
  imbalance_draws: false           # binary minority LogU(4/N, 0.5), multiclass Dirichlet
  categorical_mode: ordered        # unordered: permuted LogInt(2, 64)-level Zipf codes
  missing_mode: mcar               # mixed: MCAR / MAR / MNAR at LogU(0.01, 0.3)
  tie_column_prob: 0.0             # per numeric column: ties, point mass or zero inflation
  irrelevant_frac_max: 0.0         # share of width as row-permuted copies, U(0, max)
  duplicate_frac_max: 0.0          # share of width as near-duplicates, U(0, max)
  label_flip_max: 0.0              # per-task label flip rate, U(0, max)

# Every TrainConfig field, read by fintfm-train (DR1.3; the knobs of audit AU5.2, AU5.10 and
# AU5.17 among them). These MIRROR the literal defaults of TrainConfig in modeling/train.py, as
# the inference section mirrors the classifier, so train() behaves the same without reading a
# file; tests/test_config.py is the drift guard. Each key is also a flag defaulting to None, so
# an explicit flag wins. Every value here reproduces pretraining as it ran before the knob
# existed.
train:
  steps: 20000             # the cosine schedule spans this many steps
  batch_size: 64           # tasks per step; tasks seen = steps x batch_size
  lr: 3.0e-4               # AdamW's tuned value at the reference recipe (§127)
  warmup_steps: 500        # linear warmup before the cosine decay
  log_every: 50
  eval_every: 500          # held-out evaluation on a stream of its own (AU1.18)
  checkpoint_every: 0      # 0 saves only at the end; every HF Jobs launch sets it (CLAUDE.md)
  seed: 0
  device: cpu
  run_steps: null          # steps in THIS invocation; null runs to steps
  resume: null             # a <out>.state file to continue from
  init_from: null          # a model checkpoint to start from, fresh optimiser and schedule
  new_prior_phase: false   # let resume continue under a different prior, a curriculum phase (DR2.4)
  feature_chunk: null      # identity-preserving memory knob for n_cell_blocks > 0 (§81)
  optimizer: adamw         # adamw, muon or schedulefree
  task_dump: null          # pre-generated batches (AU5.15); null samples live
  task_dump_allow_code_mismatch: false
  decay_norm_bias: true    # true = AdamW decays every parameter; false exempts norms/biases/embeddings
  amp: "none"              # "none" (float32), "bf16" or "fp16" autocast; quoted, YAML reads off as false
  # Muon, read only under --optimizer muon (design review DR1.7). muon_lr null = --lr under
  # rms_match (0.2*sqrt(max(n, m)) scaling, sized to share AdamW's rate), 0.02 under keller.
  muon_lr: null            # Muon's matrix-group rate
  muon_scale: "rms_match"  # "rms_match" or "keller"
  # Batch source (design review DR5.2). sync = one sequential generator on this process, every
  # checkpoint's stream; stream = batch i from default_rng([seed, i]) in worker processes.
  loader: sync
  loader_workers: 0        # stream only; the stream is the same at any count
  loader_prefetch: 2       # batches each stream worker keeps ready
  ddp: false               # torchrun data parallel over stream ranks; needs loader: stream
  # Schedule (DR5.4). cosine = warmup then cosine to zero over steps; wsd = warmup, constant,
  # then linear decay to lr_min over the last decay_frac of steps (extendable from its stable phase).
  schedule: cosine
  decay_frac: 0.1          # wsd only
  lr_min: 0.0              # wsd only
  eval_set_seed: null      # a seed = the same held-out tasks at every evaluation; null = fresh
  eval_batches: 5          # held-out batches per evaluation

# Every ModelConfig field, read by fintfm-train (DR1.3; the levers of audit AU5.2, AU5.3, AU5.9,
# AU5.16 and AU5.17 and of design review DR6.2 and DR6.3 among them). These MIRROR
# ModelConfig's literal defaults in modeling/model.py, which stay authoritative because a
# checkpoint rebuilds its model without reading a file; tests/test_config.py is the drift
# guard. The one exception is d_ff, below. Every value here builds the architecture
# fintfm-train built before the key existed.
model:
  max_features: 24              # widest table; narrower ones are padded and masked
  max_classes: 10               # head width; the published checkpoint is 2 (§158)
  d_cell: 64
  d_model: 192
  n_heads: 4                    # attention heads; must divide d_cell and d_model
  n_col_layers: 2               # column-attention layers
  n_layers: 6                   # row-attention layers
  d_ff: null                    # null = 4 x d_model, fintfm-train's convention (ModelConfig's own is 512)
  dropout: 0.0
  pooling: meanmax              # or attention (§50)
  column_id_dim: null           # null = d_cell // 4; 0 is the pre-§54 architecture
  n_horizons: null              # K-period hazard head; forces prior p_financial 1.0
  n_cell_blocks: 0              # two-way cell-attention blocks (task 39.1)
  cell_labels: false            # per-cell labels before those blocks (task 39.2)
  mask_embedding: false         # dedicated missingness embedding (task 48.10)
  head_type: binned             # or quantile (task 48.3)
  n_quantiles: 99               # quantile head width; unused when binned
  n_cell_heads: null            # heads in the cell-width stages; null shares n_heads (AU5.3)
  n_summary_tokens: 1           # >1: K learned summary tokens per row replace mean+max (AU5.3)
  value_embedding: mlp          # mlp, rbf or fourier basis on the cell value (AU5.16)
  value_basis_size: 16          # RBF centres or Fourier frequencies; unused for mlp
  value_basis_learnable: false  # train the basis centres/widths or frequencies
  value_ecdf: false             # context-only ECDF-rank channel per cell (AU5.16)
  attn_length_scale: false      # row-attention logits times log(n_ctx)/log(attn_length_ref) (AU5.17)
  attn_length_ref: 512          # context length at which the length scale is 1
  attn_impl: masked             # masked, or split: the same row attention without a mask (AU5.2)
  hazard_period_context: false  # hazard context rows embed their default period (AU5.9)
  cell_row_attn: full           # or induced: context-only inducing points, linear in N (DR6.2)
  n_inducing: 64                # inducing vectors per induced layer; unused for full
  readout: pool                 # or cls: readout tokens inside column attention (DR6.3)
  n_readout: 4                  # readout tokens per row; unused for pool
  head_mlp: false               # two-layer MLP output head instead of a linear one (DR6.3)

# Large-table wrappers for the fintfm arm of fintfm-v4protocol (audit AU5.8). The partition_*
# and boost_* keys MIRROR the literal defaults of PartitionedTFMClassifier and
# BoostedTFMClassifier in inference/large_n.py; tests/test_config.py is the drift guard.
# method "none" scores the plain classifier, exactly as before this section existed.
large_n:
  method: none                     # none, partition or boost; --large-n overrides
  partition_max_depth: 2           # at most 2**depth leaves; capped at 3
  partition_min_samples_leaf: 0.05 # tree leaf floor, rows or a fraction of the bag
  partition_n_bags: 1              # >1: forest of trees on random bag_frac subsets, averaged
  partition_bag_frac: 0.6
  partition_min_leaf_rows: 200     # smaller leaves use the global context
  partition_min_class_rows: 2      # leaves with fewer rows of any class use the global context
  boost_n_rounds: 8
  boost_context_rows: 512          # context rows per boosting round
  boost_learning_rate: 0.5
  boost_weighting: abs             # abs or exp: residual -> context sampling weight
  boost_max_step: 4.0              # upper bound of each round's line search
  boost_pool_rows: null            # residual pool cap; null tracks every training row
